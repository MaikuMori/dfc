name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  packages: write
  id-token: write  # cosign keyless signing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: |
      github.repository == 'MaikuMori/dfc' && (
        github.event_name == 'push' ||
        (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/next')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VER="${GITHUB_REF##*/}"
          else
            # PR-merge path: pick the highest .changes/v*.md (the one the merge just added).
            VER=$(ls -1 .changes/v*.md 2>/dev/null | sort -V | tail -1 \
                  | sed -E 's|^\.changes/(v[^/]+)\.md$|\1|')
          fi
          if [ -z "${VER}" ]; then
            echo "::error::Could not determine version from tag or .changes/v*.md"
            exit 1
          fi
          if [ ! -f ".changes/${VER}.md" ]; then
            echo "::error::Expected .changes/${VER}.md to exist (run prepare-release.yml first)"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VER}"

      - name: Create + push tag (PR-merge path)
        if: github.event_name == 'pull_request'
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse --verify "refs/tags/${VER}" >/dev/null 2>&1; then
            echo "Tag ${VER} already exists locally; skipping create."
          else
            git tag -a "${VER}" -m "Release ${VER}"
            git push origin "${VER}"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: latest
          args: release --clean --release-notes=.changes/${{ steps.version.outputs.version }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
