name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: |
      github.repository == 'MaikuMori/dfc' && (
        github.event_name == 'push' ||
        (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/next')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      hashes: ${{ steps.checksums.outputs.hashes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VER="${GITHUB_REF##*/}"
          else
            # PR-merge path: pick the highest .changes/v*.md (the one the merge just added).
            VER=$(ls -1 .changes/v*.md 2>/dev/null | sort -V | tail -1 \
                  | sed -E 's|^\.changes/(v[^/]+)\.md$|\1|')
          fi
          if [ -z "${VER}" ]; then
            echo "::error::Could not determine version from tag or .changes/v*.md"
            exit 1
          fi
          if [ ! -f ".changes/${VER}.md" ]; then
            echo "::error::Expected .changes/${VER}.md to exist (run prepare-release.yml first)"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VER}"

      - name: Create + push tag (PR-merge path)
        if: github.event_name == 'pull_request'
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse --verify "refs/tags/${VER}" >/dev/null 2>&1; then
            echo "Tag ${VER} already exists locally; skipping create."
          else
            git tag -a "${VER}" -m "Release ${VER}"
            git push origin "${VER}"
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: stable
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7.2.2
        with:
          version: latest
          args: release --clean --release-notes=.changes/${{ steps.version.outputs.version }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export artifact hashes for SLSA provenance
        id: checksums
        run: |
          HASHES=$(base64 -w0 < dist/checksums.txt)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

  provenance:
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.version }}
