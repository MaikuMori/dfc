# yaml-language-server: $schema=https://raw.githubusercontent.com/miniscruff/changie/main/docs/schema.json

changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md

versionFormat: '## [{{.Version}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'

# Pre-1.0 semver: breaking changes are permitted in any release and the
# major number stays at zero. Changed / Removed therefore map to `minor`
# (not `major`) so `changie next auto` cannot land us at v1.0.0 by
# accident. The moment we cut v1.0.0, flip Changed and Removed back to
# `auto: major` — that's when the major slot becomes meaningful again.
kinds:
  - label: Added
    key: added
    auto: minor
  - label: Changed
    key: changed
    auto: minor
  - label: Deprecated
    key: deprecated
    auto: minor
  - label: Removed
    key: removed
    auto: minor
  - label: Fixed
    key: fixed
    auto: patch
  - label: Security
    key: security
    auto: patch

newlines:
  afterChangelogHeader: 1
  beforeKind: 1
  afterKind: 1
  beforeVersion: 1
